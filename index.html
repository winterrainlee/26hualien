<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2e9" />
  <title>26 Hualien</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">2026 · 花蓮</p>
      <h1 id="title">화롄에서 보낸 세 달</h1>
      <p id="subtitle">대만 동부에서 내가 지나고 머문 공간의 기록.</p>
    </header>

    <section class="map-card" aria-label="경험 지도">
      <button id="back" class="back" hidden>← 대만으로</button>
      <svg id="map" viewBox="0 0 360 560" role="img" aria-label="대만과 화롄 경험 지도"></svg>
      <p id="hint" class="hint">연록색 화롄을 눌러 들어가 봐.</p>
    </section>
  </main>

  <dialog id="place-dialog">
    <article>
      <button class="close" aria-label="닫기">×</button>
      <p id="place-kind" class="eyebrow"></p>
      <h2 id="place-name"></h2>
      <p id="place-text"></p>
    </article>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>\n  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>\n  <script src="./app.js?v=5"></script>
</body>
</html>
