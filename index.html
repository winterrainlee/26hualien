<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2e9" />
  <title>26 Hualien</title>
  <link rel="stylesheet" href="./style.css?v=16" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">2026 · 花蓮</p>
      <h1 id="title">화롄에서 보낸 세 달</h1>
    </header>

    <section class="map-card" aria-label="경험 지도">
      <button id="back" class="back" hidden>← 대만으로</button>
      <svg id="map" viewBox="0 0 360 560" role="group" aria-label="대만 본섬 지도"></svg>
      <button id="region-notes" class="region-notes" aria-haspopup="dialog" hidden></button>
    </section>
  </main>

  <dialog id="place-dialog" aria-labelledby="place-name" aria-describedby="place-text">
    <article>
      <div class="dialog-toolbar">
        <button id="dialog-back" class="dialog-back" type="button" hidden>← 목록</button>
        <button class="close" aria-label="닫기">×</button>
      </div>
      <div class="dialog-content">
        <p id="place-kind" class="eyebrow"></p>
        <h2 id="place-name"></h2>
        <div id="place-text"></div>
      </div>
    </article>
  </dialog>

  <script defer src="./map-data.js?v=15"></script>
  <script defer src="./notes.js?v=16"></script>
  <script defer src="./neighbor-labels.js?v=14"></script>
  <script defer src="./app.js?v=17"></script>
</body>
</html>
