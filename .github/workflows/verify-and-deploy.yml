name: Verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_workflow: ${{ steps.pages_source.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify generated files and syntax
        run: sh scripts/check.sh

      - name: Detect Pages publishing source
        if: github.event_name != 'pull_request'
        id: pages_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tmp="$(mktemp)"
          status="$(
            curl -sS -o "$tmp" -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          )"
          if [ "$status" != "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read GitHub Pages settings (HTTP $status). Verification passed, deployment skipped."
            exit 0
          fi

          build_type="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("build_type", ""))' "$tmp")"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages source is '$build_type'. Change Settings > Pages > Build and deployment > Source to GitHub Actions."
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && steps.pages_source.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.pages_source.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.verify.outputs.pages_workflow == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
